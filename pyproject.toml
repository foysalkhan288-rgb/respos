[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cafe-os"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "langgraph>=0.1.0",
    "langchain-core>=0.1.0",
    "langchain-openai>=0.1.0",
    "pydantic>=2.0",
    "aiosqlite>=0.19.0",
    "python-dotenv>=1.0",
    "httpx>=0.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "httpx>=0.24.0",
]

[tool.hatch.build.targets.wheel]
packages = ["cafe_os"]

[tool.pytest.ini_options]
testpaths = ["tests"]
