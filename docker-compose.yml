services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cafe_os
      POSTGRES_PASSWORD: cafe_os
      POSTGRES_DB: cafe_os
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cafe_os"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    command: python3 -m uvicorn cafe_os.main:app --host 0.0.0.0 --port 8000 --workers 2
    environment:
      DATABASE_URL: postgresql://cafe_os:cafe_os@db:5432/cafe_os
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
