services:
  - type: web
    name: cafe-os
    runtime: python
    plan: free
    buildCommand: pip install -e ".[dev,prod]"
    startCommand: uvicorn cafe_os.main:app --host 0.0.0.0 --port 8000
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
